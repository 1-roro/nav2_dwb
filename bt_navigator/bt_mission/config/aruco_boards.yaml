# ArUco dock board (aruco_detector.py, tools/make_aruco_dock.py 가 읽는다)
#
# dock 좌표계 D: 원점 = 바닥에서 충전 접점 면의 가운데, x = dock 에서 방 쪽으로 (로봇이 다가오는 쪽),
#               z = 위, y = z x x (로봇이 dock 을 바라보면 오른쪽).
# marker 는 모두 x = -board_offset 의 판 위에 있다. y, z 는 marker 중심, size 는 검은 테두리 바깥 한 변 [m].
# 판을 접점 면보다 뒤에 두는 것은, 로봇이 dock 에 붙은 뒤에도 카메라가 marker 를 보게 하려는 것이다
# (시뮬레이션의 waffle: 붙었을 때 카메라 ↔ 판 0.33 m).
dictionary: DICT_4X4_50
boards:
  dock_a:
    board_offset: 0.30
    plate: {y_min: -0.18, y_max: 0.18, z_min: 0.06, z_max: 0.26}   # 흰 판 (인쇄 영역)
    markers:
      - {id: 0, y: 0.0, z: 0.155, size: 0.10}     # 큰 것: 멀리서 (약 3 m 까지)
      - {id: 1, y: -0.13, z: 0.10, size: 0.04}    # 작은 것 넷: 가까이서, 넓게 퍼져 자세가 정확하다
      - {id: 2, y: 0.13, z: 0.10, size: 0.04}
      - {id: 3, y: -0.13, z: 0.21, size: 0.04}
      - {id: 4, y: 0.13, z: 0.21, size: 0.04}
