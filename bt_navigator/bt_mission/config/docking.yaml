# 도킹 설정: 로봇, 카메라, 설비(dock)마다 달라지는 값은 모두 이 파일에 있다.
#
#   읽는 곳   aruco_detector.py (dictionary, docks), 도킹 BT 노드 (전부), aruco_teach.py / dock_calibrate.py
#   바꾸는 법 이 파일을 로봇 PC 로 복사해 고치고, 그 경로를 넘긴다 (BT 노드는 작업을 시작할 때마다 다시 읽는다):
#               ros2 run bt_mission task_server --ros-args -p docking_config:=/path/docking.yaml
#               ros2 launch bt_mission aruco_detector.launch.py config_file:=/path/docking.yaml
#   표시      [설비] dock(설비)마다  [로봇] 로봇 치수, 연결  [측정] 실제 로봇에서 재서 넣는 값 (DOCKING.md 14-3)
#             표시가 없는 것은 알고리즘 값이다. 보통 그대로 둔다
#   없는 항목은 코드의 기본값(이 파일의 값과 같다)을 쓰고, 모르는 이름이 있으면 경고한다 (오타 확인).
#   단위: m, s, m/s, rad/s. 이름이 _deg 로 끝나면 도(°).

dictionary: DICT_4X4_50

# ---- [설비] dock 마다 marker 하나 또는 여럿 -----------------------------------------------------
# dock 좌표계 D: 원점 = 바닥에서 도킹 면(로봇이 마주 서는 설비 면)의 가운데, x = 설비에서 로봇 쪽, z = 위
# 카메라는 RealSense D455 컬러 (가로 화각 약 90 도) 를 1280 x 720 으로 받는 것을 기준으로 정한 값이다 (DOCKING.md 8장).
docks:
  dock_a:               # marker 하나
    marker_id: 0        # dictionary 안의 번호
    size: 0.06          # 검은 테두리 바깥 한 변. 인쇄한 뒤 캘리퍼로 재서 고친다 (1 % 틀리면 거리가 1 % 틀린다)
    height: 0.13        # marker 중심의 바닥에서 높이 = 카메라 렌즈 높이에 맞춘다 (가까이서 화면 가운데에 오게)
    offset: 0.0         # marker 면이 도킹 면보다 뒤로 물러난 거리 (면에 바로 붙였으면 0)
    lateral: 0.0        # marker 중심이 도킹 자리의 가운데에서 옆으로 (+ = 로봇이 볼 때 오른쪽)
    gap: 0.15           # 붙었을 때 로봇 앞면 ↔ 도킹 면. 가르친 자세(aruco_teach.py)가 있으면 그것이 우선
  # marker 둘 (DOCKING.md 8-3): 같은 높이에 가로로 나란히. 방향(yaw)이 두 marker 사이의 거리로 정해져서 훨씬 정확하다.
  # 60 mm 둘을 중심 간격 160 mm 로: 붙은 자리(카메라 ↔ 면 0.16 m)에서 D455 의 가로 시야 0.32 m 안에 좌우 50 mm 씩 남는다.
  # 한 장(A4 가로)에 찍어서 간격이 인쇄로 정해지게 한다 (tools/make_aruco_dock.py). size, height, offset 은 marker 마다
  # 따로 적을 수도 있다. dock_a 에 marker 를 하나 더 붙이려면 marker_id 줄 대신
  #   markers: [{id: 0, lateral: -0.08}, {id: 1, lateral: 0.08}]
  # (1번은 그때를 위해 비워 두었다. marker 번호는 dock 끼리 겹치면 안 된다)
  dock_b:
    size: 0.06
    height: 0.13
    offset: 0.0
    gap: 0.15
    markers:
      - {id: 2, lateral: -0.08}     # 로봇이 볼 때 왼쪽
      - {id: 3, lateral: 0.08}      # 오른쪽. lateral 은 "붙은 자리의 카메라 정면" 에서 좌우로 같게 둔다

# ---- [로봇] 치수 (base_frame 에서) --------------------------------------------------------------
robot:
  front: 0.16           # 중심 → 앞면
  rear: 0.16            # 중심 → 뒷면
  half_width: 0.15      # 중심 → 옆면
  turn_radius: 0.22     # 제자리에서 돌 때 쓸고 가는 반지름 (중심 → 가장 먼 모서리)

# ---- [로봇] frame 과 토픽 -----------------------------------------------------------------------
ros:
  odom_frame: odom
  base_frame: base_footprint
  cmd_vel_topic: cmd_vel_nav        # collision_monitor, velocity_smoother 를 거치는 입력
  scan_topic: scan                  # 2D 레이저. 비우면 제자리 회전(찾기)과 뒤 확인을 하지 않는다
  detection_topic: dock/aruco

# ---- 움직임: 모든 단계의 기본값. stages 에서 단계마다 덮어쓴다 ----------------------------------
motion:
  max_vx: 0.15          # [로봇] 앞뒤
  max_vy: 0.10          # [로봇] 옆 (메카넘은 옆으로 갈 때 더 미끄러지므로 낮게)
  max_wz: 0.4
  min_vx: 0.010         # [측정] 이보다 느린 명령은 로봇이 움직이지 않는다 (데드밴드)
  min_vy: 0.015         # [측정]
  min_wz: 0.03          # [측정]
  accel_x: 0.3
  accel_y: 0.2
  accel_wz: 1.0
  scale_vx: 1.0         # [측정] 명령한 속도 / 실제로 나온 속도. dock_calibrate.py 가 잰다
  scale_vy: 1.0         # [측정] (옆 효율 0.88 이면 1.14)
  scale_wz: 1.0         # [측정]
  k_along: 0.8          # 비례 이득 [1/s]
  k_lat: 1.2
  k_yaw: 1.5
  tol_along: 0.003      # 허용오차 (앞뒤, 옆, 방향)
  tol_lat: 0.002
  tol_yaw_deg: 0.3
  # 깔때기: 남은 거리 d 에서 옆 오차가 lat0 + lat_slope * d 안이어야 설비 쪽으로 간다 (방향도 같은 식)
  funnel_lat0: 0.004
  funnel_lat_slope: 0.15
  funnel_yaw0_deg: 0.6
  funnel_yaw_slope_deg: 14.0
  # 필터가 보는 odom 의 흐름
  odom_drift: 0.002     # 시간에 비례 [m/sqrt(s)]
  odom_slip: 0.10       # [측정] 간 거리 대비 (1 - 옆 효율 정도)
  odom_yaw_per_m: 0.05  # [측정] 1 m 갈 때 방향이 틀어지는 양 [rad/m]
  odom_turn_slip: 0.05

# ---- 단계 (task.xml 의 stage="...") --------------------------------------------------------------
stages:
  approach:             # 설 곳 standoff 앞까지. collision_monitor 켠 채
    standoff: 0.25
    max_vx: 0.15
    max_vy: 0.10
    tol_along: 0.010
    tol_lat: 0.005
    tol_yaw_deg: 1.0
    lost_timeout: 2.0   # marker 를 이만큼 못 보면 멈추고 실패 (다시 보기로)
    timeout: 30.0
    hold_if_closer: true   # 설비에서 멀어지는 쪽으로 가지 않는다. 이미 더 가까우면 건너뛴다
  insert:               # 마지막 구간. collision_monitor 끈 채, 느리게
    standoff: 0.0
    max_vx: 0.05
    max_vy: 0.03
    accel_x: 0.1
    accel_y: 0.1
    lost_timeout: 2.0
    timeout: 30.0
  refine:               # 서서 재고 고치기
    max_vx: 0.03
    max_vy: 0.03
    tol_along: 0.0015
    tol_lat: 0.0015
    tol_yaw_deg: 0.2
    settle_time: 0.5        # 선 뒤 재기 전에 기다린다
    measure_time: 1.0       # 이만큼 보고 합친다
    stable_spread: 0.0015   # 그동안 측정이 이보다 흩어져 있으면 (아직 흔들린다) 더 기다린다 [m]
    max_measure_time: 4.0
    max_iterations: 3
    all_markers: true       # marker 가 여럿인 dock: 전부 보인 영상으로만 잰다 (가르칠 때와 같은 조건)
    accept_along: 0.005     # 다 고친 뒤에도 tol 밖이면, 이 안이면 성공으로 본다
    accept_lat: 0.004
    accept_yaw_deg: 1.0
    move_timeout: 8.0
  retreat:              # 정밀 undock: marker 를 보며 dock 축을 따라 물러난다
    standoff: 0.40      # 붙은 자리에서 이만큼 뒤에 선다
    max_vx: 0.08
    max_vy: 0.03
    tol_along: 0.005
    tol_lat: 0.003
    tol_yaw_deg: 0.3
    lost_timeout: 2.0
    timeout: 30.0
    check_behind: true  # 레이저로 뒤를 보며, 막혀 있으면 선다

# ---- marker 찾기 (DetectArucoDock) --------------------------------------------------------------
detect:
  settle_time: 0.5
  look_time: 3.0
  min_detections: 8     # 이만큼 보면 끝
  min_found: 3          # look_time 이 지나도 이만큼이면 끝
  search_angles_deg: [30, -30, 60, -60]   # 안 보이면 제자리에서 돌아 볼 방향 (처음 방향에서). [] 이면 돌지 않는다
  search_wz: 0.5
  clearance: 0.05       # 돌 때 turn_radius 둘레에 비어 있어야 하는 여유
  timeout: 40.0
  use_taught: true
  taught_dir: ~/.ros/aruco_taught

# ---- 가까이 붙을 때의 안전 ----------------------------------------------------------------------
safety:
  fresh_detection: 0.5        # marker 를 이 시간 안에 본 적이 있어야 설비 쪽으로 간다 (못 보면 옆, 방향만 고친다)
  min_border_px: 10           # marker 가 화면 끝에서 이만큼 안쪽에 있어야 설비 쪽으로 간다 (여럿이면 그중 하나라도)
  min_camera_distance: 0.10   # 카메라 ↔ marker 가 붙은 면이 이보다 가까워지면 멈추고 실패 (붙은 자리보다 충분히 작게)

# ---- 단순 undock (BackOff): 지금 방향 그대로 곧게 뒤로 ------------------------------------------
undock:
  distance: 0.40
  speed: 0.05
  timeout: 20.0
  clearance: 0.05
