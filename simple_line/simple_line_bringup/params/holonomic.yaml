# 메카넘(홀로노믹) 로봇. navigation.launch.py holonomic:=True 일 때 params_file 위에 덮어쓴다.
# Nav2 의 경로 따라가기(controller)는 차동 구동처럼 돌고 나서 앞으로 간다. 옆으로 가는 속도(vy)는
# ArUco 도킹(bt_mission 의 ArucoServo, ArucoRefine, BackOff)이 낸다. 그것이 velocity_smoother 에서 0 으로 잘리지 않게 한다.
amcl:
  ros__parameters:
    robot_model_type: "nav2_amcl::OmniMotionModel"   # 옆으로 움직이는 것도 odom 의 움직임으로 본다

velocity_smoother:
  ros__parameters:
    max_velocity: [0.26, 0.15, 1.0]        # [로봇] [vx m/s, vy m/s, wz rad/s]. 도킹은 0.15 m/s 넘게 내지 않는다
    min_velocity: [-0.26, -0.15, -1.0]
    max_accel: [0.6, 0.3, 3.2]             # [로봇]
    max_decel: [-1.0, -1.0, -3.2]          # [로봇]
