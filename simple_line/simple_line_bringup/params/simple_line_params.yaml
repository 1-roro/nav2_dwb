# nav2_bringup/params/nav2_params.yaml (Humble 기본값) 위에 덮어쓸 부분만 적는다.
# simple_line.launch.py 가 두 파일을 합친다. 'plugin' 키가 있는 항목은 통째로 교체된다.

amcl:
  ros__parameters:
    # 스폰 위치. launch 인자 x_pose / y_pose / yaw 로 다시 덮어쓴다.
    set_initial_pose: true
    initial_pose:
      x: -2.0
      y: -1.0
      z: 0.0
      yaw: 0.0

planner_server:
  ros__parameters:
    # 기본 BT 가 planner_id="GridBased" 로 부르므로 이름은 그대로 둔다
    GridBased:
      plugin: "simple_line_planner::SimpleLinePlanner"
      interpolation_resolution: 0.1        # [m]

controller_server:
  ros__parameters:
    # 기본 BT 가 controller_id="FollowPath" 로 부르므로 이름은 그대로 둔다
    FollowPath:
      plugin: "simple_line_controller::SimpleLineController"
      desired_linear_vel: 0.25             # [m/s]  (velocity_smoother 상한 0.26)
      max_angular_vel: 1.0                 # [rad/s] (velocity_smoother 상한 1.0)
      lookahead_dist: 0.6                  # [m]
      rotate_to_heading_min_angle: 0.785   # 경로가 이보다 크게 틀어져 있으면 제자리 회전 [rad]
      rotate_to_heading_angular_vel: 1.0   # [rad/s]
      max_linear_accel: 0.5                # [m/s^2]
      max_angular_accel: 3.2               # [rad/s^2]
      approach_dist: 0.6                   # goal 이 이 거리 안이면 감속 [m]
      min_approach_linear_vel: 0.05        # [m/s]
      transform_tolerance: 0.1             # [s]
      max_robot_pose_search_dist: -1.0     # 가장 가까운 경로 점을 찾을 범위 [m], <= 0 이면 local costmap 반폭
