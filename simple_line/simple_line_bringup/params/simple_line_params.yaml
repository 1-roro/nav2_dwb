# nav2_bringup/params/nav2_params.yaml (Humble 기본값) 위에 덮어쓸 부분만 적는다.
# simple_line.launch.py 가 두 파일을 합친다. 'plugin' 키가 있는 항목은 통째로 교체된다.

amcl:
  ros__parameters:
    # 스폰 위치. launch 인자 x_pose / y_pose / yaw 로 다시 덮어쓴다.
    set_initial_pose: true
    initial_pose:
      x: -2.0
      y: -1.0
      z: 0.0
      yaw: 0.0

planner_server:
  ros__parameters:
    # 장애물을 보지 않고 직선을 긋는다. 길에 장애물이 있으면 collision_monitor 가 로봇을 세운다 (아래)
    GridBased:
      plugin: "simple_line_planner::SimpleLinePlanner"
      interpolation_resolution: 0.1        # [m]

controller_server:
  ros__parameters:
    # goal 에 도착했다고 보는 범위. Humble 기본값(0.25m / 0.25rad)이면 goal 20cm 앞에서 멈춘다.
    # plugin 키를 적지 않았으므로 기본 설정(SimpleGoalChecker, stateful)에 이 두 값만 덮어쓴다
    general_goal_checker:
      xy_goal_tolerance: 0.05              # [m]
      yaw_goal_tolerance: 0.05             # [rad] (약 3°)
    # 진행 확인: movement_time_allowance 동안 0.5m 를 못 가면 "Failed to make progress" 로 FollowPath 를 실패시킨다.
    # collision_monitor 가 로봇을 세워 둔 시간도 여기에 들어가므로, 장애물을 기다려 줄 시간으로 정한다 (Humble 기본 10초)
    progress_checker:
      movement_time_allowance: 30.0        # [s]
    # 장애물을 보지 않는다. 길에 장애물이 있으면 collision_monitor 가 로봇을 세운다 (아래)
    FollowPath:
      plugin: "simple_line_controller::SimpleLineController"
      desired_linear_vel: 0.25             # [m/s]  (velocity_smoother 상한 0.26)
      max_angular_vel: 1.0                 # [rad/s] (velocity_smoother 상한 1.0)
      lookahead_dist: 0.6                  # [m]
      rotate_to_heading_min_angle: 0.785   # 경로가 이보다 크게 틀어져 있으면 제자리 회전 [rad]
      rotate_to_heading_angular_vel: 1.0   # [rad/s]
      rotate_to_heading_tolerance: 0.03    # 제자리 회전은 방향 오차가 이 안으로 들어올 때까지 계속한다 [rad]
      rotate_settled_angular_vel: 0.05     # 회전이 이 각속도 아래로 멈춘 뒤에 출발한다 [rad/s]
      max_linear_accel: 0.5                # [m/s^2]
      max_angular_accel: 3.2               # [rad/s^2]
      approach_dist: 0.6                   # goal 이 이 거리 안이면 감속 [m]
      min_approach_linear_vel: 0.05        # [m/s]
      transform_tolerance: 0.1             # [s]
      max_robot_pose_search_dist: -1.0     # 가장 가까운 경로 점을 찾을 범위 [m], <= 0 이면 local costmap 반폭

waypoint_follower:
  ros__parameters:
    # follow_waypoints.py 가 쓰는 waypoint_follower 설정 (값은 Humble 기본값과 같다)
    loop_rate: 20                          # goal 진행 상태를 확인하는 주기 [Hz]
    stop_on_failure: false                 # false: goal 하나가 실패해도 다음 goal 로 계속 (실패한 index 는 결과로 알려 준다)
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200         # 각 goal 에 도착한 뒤 기다리는 시간 [ms]

# stop & go: 로봇 앞 정지 구역에 레이저 점이 들어오면 로봇을 세우고, 비면 다시 보낸다 (Nav2 collision_monitor, Humble).
#   Nav2 (velocity_smoother, behavior_server) --cmd_vel--> collision_monitor --cmd_vel_safe--> 로봇
# Nav2 goal 은 취소되지 않는다. 그동안 controller 는 계속 cmd_vel 을 내고, collision_monitor 가 0 으로 바꿔 보낸다.
# simple_line.launch.py 가 이 노드를 띄우고, 로봇(Gazebo diff drive)이 cmd_vel_safe 를 듣게 한다.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "cmd_vel_safe"
    transform_tolerance: 0.5               # [s]
    source_timeout: 5.0                    # scan 이 이보다 오래되면 버린다. 그러면 막힌 곳이 없는 것으로 본다 (Humble 동작) [s]
    base_shift_correction: true            # scan 이후 로봇이 움직인 만큼 점을 옮겨서 판단한다
    stop_pub_timeout: 2.0                  # 세운 뒤 0 속도를 이 시간 동안 보내고 멈춘다 [s]
    polygons: ["StopZone"]
    StopZone:
      type: "polygon"
      # base_footprint 기준 사각형 [x1, y1, x2, y2, ...] [m]. 앞 0.5m, 좌우 0.25m (waffle 폭 0.31m, 앞면 x=0.07m)
      points: [0.5, 0.25, 0.5, -0.25, 0.0, -0.25, 0.0, 0.25]
      action_type: "stop"
      max_points: 3                        # 구역 안의 점이 이보다 많으면 세운다
      visualize: true
      polygon_pub_topic: "polygon_stop"    # RViz 의 StopZone 표시
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
